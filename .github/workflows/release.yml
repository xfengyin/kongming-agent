name: Release

# 打 tag v*（如 v0.1.0）时触发：
#   1. build 矩阵：构建三平台二进制（linux-amd64 / windows-amd64 / darwin-arm64）
#   2. 压缩为 tar.gz / zip 并作为 workflow artifact 上传
#   3. release 收尾 job：聚合所有产物，一次性创建 GitHub Release
# 权限最小化：仅 contents: write（创建 Release 所需）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.21'
  BINARY_NAME: kongming

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
          - goos: darwin
            goarch: arm64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o dist/${BINARY_NAME}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/kongming

      - name: Package (${{ matrix.ext }})
        run: |
          mkdir -p dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          cp dist/${BINARY_NAME}${{ matrix.goos == 'windows' && '.exe' || '' }} dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}/
          cp README.md dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cd dist && zip -r ${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.zip ${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          else
            tar -czf dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist ${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
