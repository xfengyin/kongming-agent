name: CI

# P3：PR 上也跑。加触发 ≠ 有门禁，门禁由分支保护的 required_status_checks + enforce_admins 决定。
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 探针：故意让 CI 红。只存在于取证分支，PR 验完即关、分支即删。
      - name: 探针：故意失败（取证用）
        run: |
          echo "::error::探针步骤故意失败：验证 required_status_checks + enforce_admins 是否真挡人"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: go test
        run: go test ./...
