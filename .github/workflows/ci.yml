name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # 与 go.mod 中的 go directive 保持一致
  GO_VERSION: '1.25'
  # 覆盖率硬门禁：低于 80% 直接 fail
  COVERAGE_THRESHOLD: '80'

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race + coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  coverage:
    name: Coverage gate (>= ${{ env.COVERAGE_THRESHOLD }}%)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -1
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          COV_INT=${COV%.*}
          echo "Measured coverage: ${COV}%"
          if [ "${COV_INT:-0}" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "::error::Coverage ${COV}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
          echo "Coverage gate passed (>= ${{ env.COVERAGE_THRESHOLD }}%)"

  build:
    name: Build
    needs: [lint, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: go build -ldflags="-s -w" -o bin/ ./cmd/...

      - name: go vet
        run: go vet ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kongming-binaries
          path: bin/
