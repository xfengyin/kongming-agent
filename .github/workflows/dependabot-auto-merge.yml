name: Dependabot Auto Merge

# 自动化：Dependabot PR 的 CI 全绿后自动 squash 合并并删分支。
# 触发：
#   1) workflow_run：CI / Gemini PR Review 跑完后立即尝试（快路径）
#   2) schedule：每 30 分钟兜底扫描（慢路径，处理时序/漏触发）
# 安全：仅处理 dependabot 的 PR（gh 新版把 author.login 报成 app/dependabot，故用宽松匹配），且要求 mergeable + 所有检查 bucket 为 pass/skipping。
on:
  workflow_run:
    workflows: ["CI", "Gemini PR Review"]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  automerge:
    name: Auto-merge green Dependabot PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Merge green dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "== 扫描 open 的 Dependabot PR =="
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,title,author,mergeable,isDraft > /tmp/prs.json

          jq -r '.[] | select(.author.login | test("dependabot"; "i")) | select(.isDraft == false) | "\(.number)\t\(.mergeable)\t\(.title)"' /tmp/prs.json \
          | while IFS=$'\t' read -r num mergeable title; do
              [ -z "${num:-}" ] && continue
              echo "---- PR #$num ($mergeable): $title"
              if [ "$mergeable" != "MERGEABLE" ]; then
                # 列表接口对未计算合并性的 PR 返回 UNKNOWN，用单 PR 接口强制复核
                mergeable=$(gh pr view "$num" --repo "$REPO" --json mergeable --jq .mergeable 2>/dev/null || echo UNKNOWN)
                echo "   复核合并性：$mergeable"
              fi
              if [ "$mergeable" = "CONFLICTING" ] || [ "$mergeable" = "DIRTY" ]; then
                echo "   跳过：存在冲突（$mergeable）"
                continue
              fi

              checks=$(gh pr checks "$num" --repo "$REPO" --json name,bucket,state 2>/dev/null || echo '[]')
              total=$(echo "$checks" | jq 'length')
              fail=$(echo "$checks" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')
              pending=$(echo "$checks" | jq '[.[] | select(.bucket == "pending")] | length')

              if [ "$total" -eq 0 ]; then
                echo "   跳过：该仓库没有任何 CI 检查，避免无验证自动合并"
                continue
              fi
              if [ "$fail" -gt 0 ]; then
                echo "   跳过：有失败检查"
                continue
              fi
              if [ "$pending" -gt 0 ]; then
                echo "   跳过：检查仍在运行"
                continue
              fi

              echo "   ✅ 合并性正常且检查通过，执行 squash 合并"
              merged=0
              for attempt in 1 2 3; do
                if gh pr merge "$num" --repo "$REPO" --squash --delete-branch; then merged=1; break; fi
                echo "   ⚠️ 第 $attempt 次未成功（同轮先合并的 PR 会改动 base），5 秒后重试"
                sleep 5
              done
              [ "$merged" = 1 ] || echo "   ❌ 三次都没成功，留给下一轮扫描"
            done
          echo "== 完成 =="
