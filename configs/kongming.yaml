# Kongming 孔明军师系统配置 (v2 schema)
#
# 对应 pkg/infra/config/schema.go 中 11 个子配置 struct。
# 加载顺序：默认值 → 配置文件 → KONGMING_* 环境变量 → 校验。
version: "2.0"

# HTTP/gRPC 服务监听与超时
server:
  host: "0.0.0.0"
  port: 8080
  grpc_port: 8081
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

# 可观测特性开关
features:
  enable_metrics: true
  enable_tracing: true
  enable_observatory: true

# 观测：metrics 端口 + tracing (OTLP) + 结构化日志
observatory:
  metrics_port: 9090
  tracing:
    enabled: true
    exporter: otlp
    endpoint: "http://localhost:4318/v1/traces"
    sampling_rate: 1.0
  log:
    level: info
    encoding: json

# 军师（Commander）执行参数
commander:
  default_timeout: 30s
  max_concurrent_orders: 100

# 调度器参数
dispatcher:
  queue_size: 1000
  timeout: 30s

# 五虎将（General）池
generals:
  pool_size: 5
  default_timeout: 60s

# 八卦阵（Workflow）默认参数
bagua:
  default_mode: "dizai"
  max_parallel_nodes: 10

# 锦囊库（Strategy Vault）
vault:
  dir: "./strategies"
  auto_reload: true
  builtin_only: false

# 传令兵（Courier）通道
courier:
  inbox_size: 1000
  outbox_size: 1000
  delivery_timeout: 30s

# 弹性执行链：retry + circuit_breaker + rate_limit
resilience:
  retry:
    max_attempts: 3
    initial_backoff: 100ms
    max_backoff: 30s
    backoff_factor: 2.0
    jitter: true
  circuit_breaker:
    threshold: 5
    timeout: 60s
  rate_limit:
    rps: 1000
    burst: 2000

# 插件系统
plugin:
  dir: "./plugins"
  extensions: [".so", ".yaml"]
  watch: true
