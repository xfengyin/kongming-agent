# Kongming 孔明军师系统配置示例
# 复制此文件为 kongming.yaml 并修改配置
#
# LLM 配置：以环境变量为准（KONGMING_API_KEY / KONGMING_BASE_URL /
# KONGMING_MODEL），见 README「LLM Provider 配置」一节。

version: "1.0"

# 服务配置
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

# 功能开关
features:
  enable_metrics: true
  enable_tracing: false   # 链路追踪为 roadmap，当前仅指标
  enable_observatory: true

# 观测配置（Prometheus 指标）
observatory:
  metrics_port: 9090

# LLM 配置（环境变量优先；此处为文档性示例）
llm:
  base_url: "https://api.openai.com/v1"   # DeepSeek: https://api.deepseek.com/v1
  model: "gpt-4o-mini"                    # DeepSeek: deepseek-chat
  api_key_env: "KONGMING_API_KEY"

# 军师配置
commander:
  default_timeout: 30s
  max_concurrent_orders: 100

# 五虎将配置
generals:
  pool_size: 5
  default_timeout: 60s

# 锦囊库配置
vault:
  dir: "./strategies"
  auto_reload: true

# 八卦阵配置（roadmap：引擎执行器未接线）
bagua:
  default_mode: "dizai"
  max_parallel_nodes: 10

# 传令兵配置
courier:
  inbox_size: 1000
  outbox_size: 1000
  delivery_timeout: 30s

# 复读机配置
repeater:
  max_attempts: 3
  initial_backoff: 100ms
  max_backoff: 30s
  backoff_factor: 2.0
