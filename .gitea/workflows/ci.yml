name: CI

# PR / push 触发：go vet + go test -race + 构建校验
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: '1.25.5'
  # 2026-10-09/10 实测：runner 只配了单个 goproxy.cn，偶发 TLS handshake timeout
  # 会让 Download dependencies 直接失败（go: ... net/http: TLS handshake timeout）。
  # 加兜底：任一代理超时 go 会自动顺次尝试下一个。
  # Gitea 的 runner 已经把 Go 缓存 bind mount 成持久化目录：
  #   /vol1/act-runner-cache/go-mod  -> /root/go/pkg/mod      (GOMODCACHE)
  #   /vol1/act-runner-cache/go-build -> /root/.cache/go-build (GOCACHE)
  # 所以 setup-go 的 actions cache 完全重复；而它的 cache-save 后置步骤实测要 ~10 分钟
  # （tar + zstd 打包整个 Go 缓存再上传）。Gitea 侧关掉，GitHub 侧保留。
  GOPROXY: https://goproxy.cn,https://mirrors.aliyun.com/goproxy/,https://goproxy.io,direct
  GOSUMDB: sum.golang.google.cn

# 同一分支的新 run 直接取代旧的：本机只有 2 个 runner 槽位，重复排队会重复跑完整构建
# （picoclaw 一次 build-all 实测 30+ 分钟）。cancel-in-progress 用 false 时只要有一个 run
# 卡住，整个并发组会被永久毒死（2026-10-09 在 mimiclaw-orangepi 上踩过）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vet:
    timeout-minutes: 60  # 防挂死：实测本 Gitea 会执行这个上限（orangepi task1126 在 60.1 分钟被切断并 FAIL）
    name: Vet
    # go vet 要拉全模块并编译，属于重活：Gitea 侧钉在 NAS(amd64)，别落到 1.4G 的 OrangePi
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ github.server_url == 'https://github.com' }}

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  test:
    timeout-minutes: 60  # 防挂死：实测本 Gitea 会执行这个上限（orangepi task1126 在 60.1 分钟被切断并 FAIL）
    name: Test (race)
    runs-on: amd64
    needs: vet
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ github.server_url == 'https://github.com' }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  build:
    timeout-minutes: 60  # 防挂死：实测本 Gitea 会执行这个上限（orangepi task1126 在 60.1 分钟被切断并 FAIL）
    name: Build
    # 同样要编译 + 跑 smoke，属于重活
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ github.server_url == 'https://github.com' }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -ldflags="-s -w" -o kongming ./cmd/kongming

      - name: Smoke test (offline demo)
        run: |
          ./kongming --mock --ask "天下大势如何？" | grep -q "诸葛亮"
          ./kongming --mock --tool calc --ask "计算 123*456" | grep -q "56088"
          go run ./examples/quickstart > /dev/null

      - name: Build examples
        run: go build ./examples/...

      - name: Upload artifact (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: kongming-binary
          path: kongming

      - name: Upload artifact (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: kongming-binary
          path: kongming
